[project]
name = "oreag-mcp"
version = "0.2.0"
description = "MCP server for Oreag - per-project agent memory + RAG over documents. Runs locally over stdio or deployed as a remote streamable-HTTP connector."
requires-python = ">=3.10"
# mcp is capped below 2: 2.x renamed FastMCP to MCPServer and removed
# mcp.server.fastmcp, so the unbounded pin broke the Render build. Lift the cap
# only together with a migration to the 2.x API.
dependencies = ["mcp[cli]>=1.10,<2", "httpx>=0.27", "uvicorn>=0.30"]

[project.scripts]
oreag-mcp = "oreag_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

name: verify

# The harness that keeps documentation honest, plus the existing test suites.
# The code is the source of truth: if a change lands that the architecture
# model, README, flow doc, docs page or API tab do not reflect, this fails.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  docs-sync:
    name: documentation is in sync with the code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # No dependencies needed: the harness parses the source with ast + re
      # rather than importing the app, so it runs without a database or keys.
      - name: Check for documentation drift
        run: python scripts/check_docs_sync.py

  architecture-model:
    name: LikeC4 model validates and every view renders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate the model
        run: npx --yes likec4@latest validate .
      - name: Build it (catches views that parse but cannot lay out)
        run: npx --yes likec4@latest build -o /tmp/likec4-dist .
      - name: Fail on empty views
        # A view whose predicate matches nothing still validates. Exporting
        # each one and checking its size is the only way to catch it.
        run: |
          npx --yes likec4@latest gen mmd --outdir /tmp/likec4-check .
          empty=$(find /tmp/likec4-check -name '*.mmd' -size -5 -o -name '*.mmd' | while read -r f; do
            lines=$(wc -l < "$f")
            if [ "$lines" -le 6 ]; then echo "$f ($lines lines)"; fi
          done)
          if [ -n "$empty" ]; then
            echo "Empty or near-empty views detected:"
            echo "$empty"
            exit 1
          fi
          echo "All views have content."

  backend-tests:
    name: backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      # crypto.py refuses to encrypt without APP_ENCRYPTION_KEY, which is
      # correct: a silent fallback would mean shipping unencrypted BYOK keys.
      # CI has no .env (it is gitignored, and must stay that way), so mint a
      # throwaway key per run instead. Generated rather than hardcoded so no
      # key-shaped string sits in the repo to be mistaken for the real one -
      # the tests only encrypt and decrypt within a single process, so the
      # value is irrelevant as long as it is a valid Fernet key.
      - name: Mint a throwaway encryption key for this run
        working-directory: backend
        run: |
          KEY=$(python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          echo "APP_ENCRYPTION_KEY=$KEY" >> "$GITHUB_ENV"
      - name: Run pytest
        working-directory: backend
        run: python -m pytest tests -q

  frontend-build:
    name: frontend typecheck, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-time-placeholder

name: Standby fork
# The standby Render account deploys from RenderDeploy/Oreag, a fork of this
# repository; Hexra deploys from this one. A fork does not follow its parent,
# and the standby serves whenever Hexra is suspended, so it must not fall
# behind on the code it runs.
#
# The fork is synced by hand on GitHub ("Sync fork"), after which Render
# redeploys the standby on its own. This job never fails: it warns when the
# fork is missing changes to backend/ or mcp-server/, the only folders the
# standby builds. If STANDBY_FORK_TOKEN is ever set (a fine-grained token from
# the RenderDeploy account for RenderDeploy/Oreag, Contents and Workflows
# "Read and write"), it syncs the fork itself instead.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sync-standby-fork
  cancel-in-progress: false
jobs:
  check:
    # The fork receives this file too; it must not check itself.
    if: github.repository == 'haroontrailblazer/Oreag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sync the fork, or warn if the standby would run old code
        env:
          FORK_TOKEN: ${{ secrets.STANDBY_FORK_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$FORK_TOKEN" ]; then
            GH_TOKEN="$FORK_TOKEN" gh api -X POST repos/RenderDeploy/Oreag/merge-upstream -f branch=main
            exit 0
          fi
          missing=$(gh api "repos/RenderDeploy/Oreag/compare/main...haroontrailblazer:Oreag:main" \
            --jq '[.files[]?.filename | select(startswith("backend/") or startswith("mcp-server/"))] | length')
          if [ "$missing" != "0" ]; then
            echo "::warning::RenderDeploy/Oreag is missing changes to $missing file(s) in backend/ or mcp-server/. Press \"Sync fork\" on github.com/RenderDeploy/Oreag so the standby Render account runs the same code."
          else
            echo "The standby builds the same backend/ and mcp-server/ code as main."
          fi

name: Render failover
# Keeps oreag.vercel.app on whichever Render account has free hours left:
# Hexra while it is up, the second account while Hexra is suspended.
# See scripts/render_failover.py. MCP fails over per request on its own
# (frontend/src/app/mcp/projects/[projectId]/mcp/route.ts).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report what would change without changing it
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: render-failover
  cancel-in-progress: false
jobs:
  failover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/render_failover.py
          sparse-checkout-cone-mode: false
      - name: Point production at the serving account
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: python3 scripts/render_failover.py ${{ inputs.dry_run && '--dry-run' || '' }}
